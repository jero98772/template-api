repos:
  - repo: local
    hooks:
      # ── Type checking ───────────────────────────────────────────────
      - id: ty-check
        name: ty check
        entry: uv run ty check
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        pass_filenames: false
        stages: [pre-commit]
      # ── Formatting ──────────────────────────────────────────────────
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        pass_filenames: false
        stages: [pre-commit]

      # ── Linting (auto-fix, then hard-fail if still broken) ──────────
      - id: ruff-check-fix
        name: ruff check --fix
        entry: uv run ruff check --fix
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        pass_filenames: false
        stages: [pre-commit]

      # ── Tests ───────────────────────────────────────────────────────
      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        pass_filenames: false
        stages: [pre-commit]
        # Optional: only run when Python files change
        types: [python]